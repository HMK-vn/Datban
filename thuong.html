  <script>
    document.getElementById("txtNgayT").value = new Date().toISOString().split("T")[0];

    function checkRushHour() {
      const selectGio = document.getElementById("selectGioVao");
      const noticeBox = document.getElementById("rushHourNotice");
      if (!selectGio || !noticeBox) return;

      const val = selectGio.value;
      const rushHours = ["18:30", "19:00", "19:30", "20:00"];

      if (true || rushHours.includes(val)) { // lưu ý giờ đến luôn hiện (14/11/2026)
        noticeBox.style.display = "block";
      } else {
        noticeBox.style.display = "none";
      }
    }

    // Tự động kiểm tra ngay khi mở trang
    checkRushHour();

    // Khung giờ khóa bàn thường cài ở tab 6 web quản trị (giờ + các thứ áp dụng); chưa tải xong thì chưa khoá
    var KHOA_GIO = { bat: false, tu: "18:00", den: "20:30", thu: [5, 6] }, NGAY_KHOA = [], NGAY_RIENG = {};
    function khoaGioHomChonT_() {
      if (!KHOA_GIO.bat) return false;
      var v = document.getElementById("txtNgayT").value; if (!v) return false;
      var p = v.split("-").map(Number);
      return (KHOA_GIO.thu || []).indexOf(new Date(p[0], p[1] - 1, p[2]).getDay()) !== -1;
    }
    // Dòng ghi chú giờ luôn 1 hàng: chữ tự nhỏ lại cho vừa (tối thiểu 8px), quá nữa thì cắt bằng dấu …
    function vuaMotHang_(el) {
      if (!el || el.style.display === "none") return;
      var fs = 10.5; el.style.fontSize = fs + "px";
      while (el.scrollWidth > el.clientWidth + 1 && fs > 8) { fs -= 0.5; el.style.fontSize = fs + "px"; }
    }
    document.addEventListener("change", function() { setTimeout(function() { if (window._rutTinhLai) window._rutTinhLai(); }, 0); });
    function nutSanSang_() { var f = document.getElementById("bookingForm"), n = document.getElementById("btnSubmitT"); if (f && n) n.classList.toggle("san-sang", f.checkValidity() && !n.disabled); } // đủ thông tin → nút gửi nháy chậm
    document.addEventListener("input", function() { setTimeout(nutSanSang_, 0); }); document.addEventListener("change", function() { setTimeout(nutSanSang_, 0); }); setInterval(nutSanSang_, 1500);
    function rongGoiYGio_() { var h = document.getElementById("khoaGioHintT"); if (!h) return; var o = h.closest(".o-cot-ngay"); if (o) o.classList.toggle("co-goi-y", h.style.display !== "none"); }
    window.addEventListener("resize", function() { rongGoiYGio_(); vuaMotHang_(document.getElementById("khoaGioHintT")); });
    // Tỉnh / TP ở cột hẹp: bấm chọn thì hiện đủ tên, chọn xong hiện tên ngắn (giá trị gửi đi giữ nguyên value)
    function rutTenTinh_() {
      var sel = document.querySelector('select[name="tinhThanh"]'); if (!sel || sel._rut) return; sel._rut = true;
      [].forEach.call(sel.options, function(o) { o.dataset.day = o.text; });
      var cv = document.createElement("canvas").getContext("2d");
      function rong() { var cs = getComputedStyle(sel); cv.font = cs.font; return sel.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2; }
      function ngan(o) {
        var s = (o.value === "Khác" ? "Khác" : String(o.value || o.dataset.day).replace(/\s*\(.*?\)\s*$/, "")).replace(/Hồ Chí Minh/i, "HCM").trim(), max = rong();

  const dateObj = new Date(selectedDateStr);
  const day = dateObj.getDay(); // 5 = Thứ 6, 6 = Thứ 7

  if (day === 5 || day === 6) {
    const h = parseInt(hourVal, 10);
    const m = parseInt(minuteVal, 10);
    if (h < 14) {
