/* Cầu nối thay cho google.script.run: gọi Apps Script qua API (không kèm cookie Google)
   -> không bị lỗi "không thể mở tệp" khi trình duyệt đăng nhập nhiều tài khoản Google */
(function () {
  if (window.google && window.google.script) return;
  var API = "https://script.google.com/macros/s/AKfycbxzF35ugPCL5jDZrmZzOSx4-ZsoEZimxM6lDKn4zYcajHimG_K1250pip16IEqsDHqQQg/exec";
  function goi(ten, args, ok, fail) {
    fetch(API, { method: "POST", redirect: "follow", credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: ten, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("Máy chủ trả lỗi " + r.status); return r.json(); })
      .then(function (res) {
        if (res.ok) { if (ok) ok(res.result); }
        else { var e = new Error(res.error); if (fail) fail(e); else alert("Lỗi: " + res.error); }
      })
      .catch(function (err) {
        var e = new Error("Không kết nối được máy chủ, vui lòng thử lại. (" + err.message + ")");
        if (fail) fail(e); else alert(e.message);
      });
  }
  function taoRun() {
    var ok = null, fail = null, base = {
      withSuccessHandler: function (f) { ok = f; return p; },
      withFailureHandler: function (f) { fail = f; return p; },
      withUserObject: function () { return p; }
    };
    var p = new Proxy(base, { get: function (t, ten) {
      if (ten in t) return t[ten];
      return function () { goi(String(ten), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: { host: { close: function () { throw new Error("Không chạy trong Google Sheet"); } } } };
  Object.defineProperty(window.google.script, "run", { get: taoRun });
})();
</script>

  <script>
    document.getElementById("txtNgayT").value = new Date().toISOString().split("T")[0];

    function checkRushHour() {
      const selectGio = document.getElementById("selectGioVao");
      const noticeBox = document.getElementById("rushHourNotice");
      if (!selectGio || !noticeBox) return;

      const val = selectGio.value;
      const rushHours = ["18:30", "19:00", "19:30", "20:00"];

      if (rushHours.includes(val)) {
        noticeBox.style.display = "block";
      } else {
        noticeBox.style.display = "none";
      }
    }

    // Tự động kiểm tra ngay khi mở trang
    checkRushHour();

    function addDishRowT() {
      const tbody = document.getElementById("dishesBodyT");
      const tr = document.createElement("tr");
      tr.innerHTML = '<td><input type="text" class="form-control form-control-sm dish-name" placeholder="Tên món"></td><td><input type="number" min="1" value="1" class="form-control form-control-sm text-center dish-qty"></td><td><input type="text" class="form-control form-control-sm dish-note" placeholder="Ghi chú"></td><td class="text-center"><button type="button" class="btn-close btn-sm" onclick="this.closest(\'tr\').remove()"></button></td>';
      tbody.appendChild(tr);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitT");
      const msg = document.getElementById("statusMsgT");
      btn.disabled = true;
      btn.innerText = "Đang gửi dữ liệu...";

      const form = document.getElementById("bookingForm");
      const dishes = [];
      document.querySelectorAll("#dishesBodyT tr").forEach(function(r) {
        const name = r.querySelector(".dish-name").value.trim();
        const qty = r.querySelector(".dish-qty").value || 1;
        const note = r.querySelector(".dish-note").value.trim();
        if (name) dishes.push(name + " (x" + qty + ")" + (note ? " - " + note : ""));
      });

      const data = {
        hoTen: form.hoTen.value,
        sdt: form.sdt.value,
        doTuoi: form.doTuoi.value,
        gioiTinh: form.gioiTinh.value,
        tinhThanh: form.tinhThanh.value,
        email: form.email.value,
        ngay: form.ngay.value,
        gioVao: form.gioVao.value,
        soKhach: form.soKhach.value,
        coTreEm: document.getElementById("coTreEmCheckT").checked,
        soTreEm: document.getElementById("childQuantitySelectT").value,
        xuatVat: "Không",
        datMon: dishes.join("\n"),
        ghiChu: form.ghiChu.value,
        nhomBan: "",
        decor: "Không",
        mauDecor: "",
        kenhNguon: "Web Đặt Thường"
      };

      google.script.run
        .withSuccessHandler(function(res) {
          window._sdtVuaDat = data.sdt;
          msg.className = "alert alert-light border mt-3";
          msg.innerHTML = res.success === false ? "" : '<div class="fw-bold text-success text-center mb-2">🎉 TIẾP NHẬN YÊU CẦU THÀNH CÔNG</div>' + document.getElementById("tplThanhCong").innerHTML;
          if (res.success === false) { msg.className = "alert alert-danger mt-3 text-center"; msg.innerText = res.message; }
          msg.style.display = "block";
          form.reset();
          btn.disabled = false;
          btn.innerText = "GỬI YÊU CẦU ĐẶT BÀN TIÊU CHUẨN";
          checkRushHour();
        })
        .withFailureHandler(function(err) {
          msg.className = "alert alert-danger mt-3 text-center";
          msg.innerText = "Lỗi kết nối: " + err;
          msg.style.display = "block";
          btn.disabled = false;
          btn.innerText = "GỬI LẠI";
        })
        .submitBooking(data);
    }
    // 1. Gợi ý Email thông minh
const emailDomains = ['gmail.com', 'yahoo.com', 'icloud.com', 'outlook.com', 'hotmail.com'];

function handleEmailInput(inputElem, containerId) {
  const val = inputElem.value;
  let suggestBox = document.getElementById(containerId);
  if (!suggestBox) return;

  const atIndex = val.indexOf('@');
  if (atIndex !== -1) {
    const userPart = val.substring(0, atIndex);
    const domainPart = val.substring(atIndex + 1).toLowerCase();
    const matched = emailDomains.filter(d => d.startsWith(domainPart));

    if (matched.length > 0 && userPart.length > 0) {
      suggestBox.innerHTML = matched.map(d => 
        `<div class="email-suggest-item" onclick="selectEmail('${userPart}@${d}', '${inputElem.id}', '${containerId}')">${userPart}@<b>${d}</b></div>`
      ).join('');
      suggestBox.style.display = 'block';
      return;
    }
  }
  suggestBox.style.display = 'none';
}

function selectEmail(fullEmail, inputId, containerId) {
  const input = document.getElementById(inputId);
  if (input) input.value = fullEmail;
  const box = document.getElementById(containerId);
  if (box) box.style.display = 'none';
}

// 2. Kịch bản kiểm tra giờ Thứ 6 & Thứ 7
function validateBookingTime(selectedDateStr, hourVal, minuteVal) {
  if (!selectedDateStr || hourVal === "" || minuteVal === "") return { valid: true };
  const dateObj = new Date(selectedDateStr);
  const day = dateObj.getDay(); // 5 = Thứ 6, 6 = Thứ 7

  if (day === 5 || day === 6) {
    const h = parseInt(hourVal, 10);
    const m = parseInt(minuteVal, 10);
    if (h < 14) {
      return { valid: false, msg: "Thứ 6 & Thứ 7 quán nhận đón khách từ 14:00 trở đi." };
    }
    if (h > 18 || (h === 18 && m > 30)) {
      return { 
        valid: false, 
        msg: "🔒 ĐÃ QUÁ 18H31 (THỨ 6 & THỨ 7)\nRất tiếc, đã quá 18h31 nên hệ thống đã khóa nhận đặt tiệc Decor cho ngày Thứ 6 / Thứ 7\nAnh/chị vui lòng chọn một ngày khác giúp Túi nhé ạ!" 
      };
    }
  }
  return { valid: true };
}
