/* Cầu nối thay cho google.script.run: gọi Apps Script qua API (không kèm cookie Google)
   -> không bị lỗi "không thể mở tệp" khi trình duyệt đăng nhập nhiều tài khoản Google */
(function () {
  if (window.google && window.google.script) return;
  var API = "https://script.google.com/macros/s/AKfycbxzF35ugPCL5jDZrmZzOSx4-ZsoEZimxM6lDKn4zYcajHimG_K1250pip16IEqsDHqQQg/exec";
  function goi(ten, args, ok, fail) {
    fetch(API, { method: "POST", redirect: "follow", credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: ten, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("Máy chủ trả lỗi " + r.status); return r.json(); })
      .then(function (res) {
        if (res.ok) { if (ok) ok(res.result); }
        else { var e = new Error(res.error); if (fail) fail(e); else alert("Lỗi: " + res.error); }
      })
      .catch(function (err) {
        var e = new Error("Không kết nối được máy chủ, vui lòng thử lại. (" + err.message + ")");
        if (fail) fail(e); else alert(e.message);
      });
  }
  function taoRun() {
    var ok = null, fail = null, base = {
      withSuccessHandler: function (f) { ok = f; return p; },
      withFailureHandler: function (f) { fail = f; return p; },
      withUserObject: function () { return p; }
    };
    var p = new Proxy(base, { get: function (t, ten) {
      if (ten in t) return t[ten];
      return function () { goi(String(ten), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: { host: { close: function () { throw new Error("Không chạy trong Google Sheet"); } } } };
  Object.defineProperty(window.google.script, "run", { get: taoRun });
})();
</script>

  <script>
    document.getElementById("txtNgayT").value = new Date().toISOString().split("T")[0];

    function checkRushHour() {
      const selectGio = document.getElementById("selectGioVao");
      const noticeBox = document.getElementById("rushHourNotice");
      if (!selectGio || !noticeBox) return;

      const val = selectGio.value;
      const rushHours = ["18:30", "19:00", "19:30", "20:00"];

      if (rushHours.includes(val)) {
        noticeBox.style.display = "block";
      } else {
        noticeBox.style.display = "none";
      }
    }

    // Tự động kiểm tra ngay khi mở trang
    checkRushHour();

    // Khung giờ khóa bàn thường cài ở tab 6 web quản trị (giờ + các thứ áp dụng); chưa tải xong thì chưa khoá
    var KHOA_GIO = { bat: false, tu: "18:00", den: "20:30", thu: [5, 6] }, NGAY_KHOA = [];
    function khoaGioHomChonT_() {
      if (!KHOA_GIO.bat) return false;
      var v = document.getElementById("txtNgayT").value; if (!v) return false;
      var p = v.split("-").map(Number);
      return (KHOA_GIO.thu || []).indexOf(new Date(p[0], p[1] - 1, p[2]).getDay()) !== -1;
    }
    function tenThuKhoaT_() { return (KHOA_GIO.thu || []).map(function(n) { return ["CN", "T2", "T3", "T4", "T5", "T6", "T7"][n]; }).join(", "); }
    function kiemNgayKhoa() {
      const khoa = NGAY_KHOA.indexOf(document.getElementById("txtNgayT").value) !== -1, btn = document.getElementById("btnSubmitT");
      document.getElementById("ngayKhoaT").style.display = khoa ? "block" : "none";
      btn.disabled = khoa;
      btn.innerText = khoa ? "NGÀY NÀY TÚI KHÔNG NHẬN KHÁCH" : "GỬI YÊU CẦU ĐẶT BÀN";
    }
    document.getElementById("txtNgayT").addEventListener("change", function() { kiemNgayKhoa(); apDungKhoaGio(); }); // đổi ngày -> áp lại khung khoá theo thứ
    var OPT_GIO = [].slice.call(document.getElementById("selectGioVao").options);
    function apDungKhoaGio() {
      const sel = document.getElementById("selectGioVao"), hint = document.getElementById("khoaGioHintT"), truoc = sel.value, khoa = khoaGioHomChonT_();
      const con = OPT_GIO.filter(function(o) { return !(khoa && o.value >= KHOA_GIO.tu && o.value <= KHOA_GIO.den); });
      sel.innerHTML = "";
      con.forEach(function(o) { sel.appendChild(o); });
      const giuLai = con.some(function(o) { return o.value === truoc; });
      const sat = con.filter(function(o) { return o.value < KHOA_GIO.tu; }).pop() || con[0];
      if (giuLai) sel.value = truoc; else if (sat) sel.value = sat.value;
      hint.style.display = KHOA_GIO.bat && (KHOA_GIO.thu || []).length ? "block" : "none";
      hint.innerText = "* " + tenThuKhoaT_() + ": tạm khóa nhận khách " + KHOA_GIO.tu + "–" + KHOA_GIO.den;
      checkRushHour();
    }
    apDungKhoaGio();
    google.script.run.withSuccessHandler(function(k) {
      if (k && k.thuong) { KHOA_GIO = k.thuong; NGAY_KHOA = k.ngayKhoa || []; apDungKhoaGio(); kiemNgayKhoa(); }
    }).withFailureHandler(function() {}).layKhoaGio();

    function addDishRowT() {
      const tbody = document.getElementById("dishesBodyT");
      const tr = document.createElement("tr");
      tr.innerHTML = '<td><input type="text" class="form-control form-control-sm dish-name" placeholder="Tên món"></td><td><input type="number" min="1" value="1" class="form-control form-control-sm text-center dish-qty"></td><td><input type="text" class="form-control form-control-sm dish-note" placeholder="Ghi chú"></td><td class="text-center"><button type="button" class="btn-close btn-sm" onclick="this.closest(\'tr\').remove()"></button></td>';
      tbody.appendChild(tr);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmitT");
      const msg = document.getElementById("statusMsgT");
      btn.disabled = true;
      btn.innerText = "Đang gửi dữ liệu...";

      const form = document.getElementById("bookingForm");
      const dishes = [];
      document.querySelectorAll("#dishesBodyT tr").forEach(function(r) {
        const name = r.querySelector(".dish-name").value.trim();
        const qty = r.querySelector(".dish-qty").value || 1;
        const note = r.querySelector(".dish-note").value.trim();
        if (name) dishes.push(name + " (x" + qty + ")" + (note ? " - " + note : ""));
      });

      const data = {
        hoTen: form.hoTen.value,
        sdt: form.sdt.value,
        doTuoi: form.doTuoi.value,
        gioiTinh: form.gioiTinh.value,
        tinhThanh: form.tinhThanh.value,
        email: form.email.value,
        ngay: form.ngay.value,
        gioVao: form.gioVao.value,
        soKhach: form.soKhach.value,
        coTreEm: document.getElementById("coTreEmCheckT").checked,
        soTreEm: document.getElementById("childQuantitySelectT").value,
        xuatVat: "Không",
        datMon: dishes.join("\n"),
        ghiChu: form.ghiChu.value,
        nhomBan: "",
        decor: "Không",
        mauDecor: "",
        kenhNguon: "Web Đặt Thường"
      };

      guiDonWebAnToan(data, function(res) {
          window._sdtVuaDat = data.sdt;
          msg.className = "alert alert-light border mt-3 p-0 overflow-hidden";
          msg.innerHTML = res.success === false ? "" : '<div class="d-flex align-items-center gap-3 text-start text-white p-3" style="background:linear-gradient(135deg,#b4703f,#c98a5b);border-radius:8px 8px 0 0"><img src="https://hmk-vn.github.io/Datban/app_icon/be_cho_200.jpg" alt="" onerror="this.onerror=null;this.src=\'https://hmk-vn.github.io/Datban/app_icon/logo_khach_192.png\'" style="width:58px;height:58px;width:min(58px,13vw);height:min(58px,13vw);border-radius:50%;object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.2);background:#fff"><div><div class="fw-bold text-nowrap" style="font-size:16px;font-size:min(16px,3.5vw);letter-spacing:.3px"><span style="display:inline-block;width:1.5em">🎉</span>TIẾP NHẬN YÊU CẦU THÀNH CÔNG</div><div class="text-nowrap" style="font-size:12.5px;font-size:min(12.5px,3.3vw);opacity:.85;padding-left:min(24px,5.25vw);margin-top:2px">Túi Nướng Lavender · Đặt bàn ăn tiêu chuẩn</div></div></div><div class="p-3">' + document.getElementById("tplThanhCong").innerHTML + '</div>';
          if (res.success === false) { msg.className = "alert alert-danger mt-3 text-center"; msg.innerText = res.message; }
          msg.style.display = res.daHuyTrung ? "none" : "block"; // khách chọn "Không gửi nữa" thì không báo gì thêm
          if (res.success !== false) { form.reset(); apDungKhoaGio(); }
          btn.disabled = false;
          btn.innerText = "GỬI YÊU CẦU ĐẶT BÀN";
          checkRushHour();
        }, function(err) {
          msg.className = "alert alert-danger mt-3 text-center";
          msg.innerText = "Chưa gửi được do mạng chập chờn. Quý khách bấm GỬI LẠI (không bị trùng đơn) hoặc gọi hotline 0911 588 138.";
          msg.style.display = "block";
          btn.disabled = false;
          btn.innerText = "GỬI LẠI";
        });
    }
    // Gửi đơn an toàn: kèm "mã gửi" để máy chủ không tạo đơn trùng; mất mạng thì tự gửi lại tối đa 2 lần
    window.addEventListener("pageshow", function(e) { if (e.persisted) location.reload(); }); // quay lại bằng nút Back: tải trang mới, không giữ thông tin đã gửi
    // Hệ thống đã có đơn cùng ngày (trùng SĐT hoặc họ tên): hỏi khách trước khi tạo thêm đơn
    function hoiGuiTrung_(res, vanGui, khong) {
      var e = function(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      var nd = res.trungSdt ? "Số điện thoại này đã có đơn ngày <b>" + e(res.ngayHien) + "</b>:<div class=\"ct-ds\">" + (res.don || []).map(function(d) { return "<div>🕒 <b>" + e(d.gio) + "</b> · " + e(d.khach) + " khách · " + e(d.tt) + "</div>"; }).join("") + "</div>"
        : "Ngày <b>" + e(res.ngayHien) + "</b> đã có đơn mang tên <b>" + e(res.ten) + "</b>.";
      var nen = document.createElement("div"); nen.className = "ct-nen";
      nen.innerHTML = '<div class="ct-hop" role="alertdialog" aria-modal="true"><div class="ct-ico">⚠️</div><div class="ct-tieude">' + (res.chanHan ? "TÚI ĐÃ NHẬN ĐƠN NÀY RỒI" : res.trungSdt ? "TÚI ĐÃ CÓ ĐƠN CỦA QUÝ KHÁCH" : "HỆ THỐNG ĐÃ CÓ TÊN NÀY") + '</div><div class="ct-nd">' + nd + '</div><div class="ct-ghi">' + (res.chanHan ? 'Quý khách không cần gửi lại ạ. Cần đổi thông tin, vui lòng gọi hotline <b>0911 588 138</b>.' : 'Nếu Quý khách đã gửi rồi thì không cần gửi lại ạ. Chỉ chọn <b>Vẫn gửi</b> khi muốn đặt thêm bàn.') + '</div>' + (res.chanHan ? '<button type="button" class="ct-khong">Đã hiểu</button>' : '<button type="button" class="ct-khong">Không gửi nữa</button><button type="button" class="ct-gui">Vẫn gửi đơn mới</button>') + '</div>';
      document.body.appendChild(nen);
      nen.querySelector(".ct-khong").onclick = function() {
        nen.remove(); khong();
        if (res.chanHan) { var f = document.getElementById("bookingForm"); if (f) f.reset(); location.reload(); } // đơn đã có rồi: xoá sạch để không gửi lại
      };
      var nutGui = nen.querySelector(".ct-gui"); if (nutGui) nutGui.onclick = function() { nen.remove(); vanGui(); };
    }
    function guiDonWebAnToan(data, khiXong, khiLoi) {
      // Gửi lại đúng thông tin vừa bị từ chối (trong 5 phút): báo lại ngay, không gửi lên máy chủ
      var khoaTC = [data.sdt, data.ngay, data.gioVao, data.soKhach, data.mauDecor || ""].join("|");
      if (window._tuChoi && window._tuChoi.khoa === khoaTC && Date.now() - window._tuChoi.luc < 300000) return khiXong({ success: false, message: window._tuChoi.msg });
      // Bấm GỬI LẠI cùng thông tin (SĐT + ngày + giờ) → dùng lại mã gửi cũ để không tạo đơn trùng
      var khoa = [data.sdt, data.ngay, data.gioVao].join("|");
      if (window._donCho && window._donCho.khoa === khoa) data.maGui = window._donCho.ma;
      data.maGui = data.maGui || ("G" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
      window._donCho = { khoa: khoa, ma: data.maGui };
      var lan = 0;
      (function gui() {
        lan++;
        google.script.run.withSuccessHandler(function(res) { if (res && res.success) window._donCho = null;
          if (res && res.success === false && !res.canhBaoTrung && !/bận|đang được xử lý|^Lỗi/.test(res.message || "")) window._tuChoi = { khoa: khoaTC, msg: res.message, luc: Date.now() };
          if (res && res.canhBaoTrung) return hoiGuiTrung_(res, function() { window._donCho = null; data.maGui = ""; data.xacNhanTrung = true; guiDonWebAnToan(data, khiXong, khiLoi); }, function() { window._donCho = null; khiXong({ success: false, daHuyTrung: true, message: "" }); });
          khiXong(res); }).withFailureHandler(function(err) {
          if (lan < 3) return setTimeout(gui, lan * 2500);
          khiLoi(err);
        }).submitBooking(data);
      })();
    }

    // 1. Gợi ý Email thông minh
const emailDomains = ['gmail.com', 'yahoo.com', 'icloud.com', 'outlook.com', 'hotmail.com'];

function handleEmailInput(inputElem, containerId) {
  const val = inputElem.value;
  let suggestBox = document.getElementById(containerId);
  if (!suggestBox) return;

  const atIndex = val.indexOf('@');
  if (atIndex !== -1) {
    const userPart = val.substring(0, atIndex);
    const domainPart = val.substring(atIndex + 1).toLowerCase();
    const matched = emailDomains.filter(d => d.startsWith(domainPart));

    if (matched.length > 0 && userPart.length > 0) {
      suggestBox.innerHTML = matched.map(d => 
        `<div class="email-suggest-item" onclick="selectEmail('${userPart}@${d}', '${inputElem.id}', '${containerId}')">${userPart}@<b>${d}</b></div>`
      ).join('');
      suggestBox.style.display = 'block';
      return;
    }
  }
  suggestBox.style.display = 'none';
}

function selectEmail(fullEmail, inputId, containerId) {
  const input = document.getElementById(inputId);
  if (input) input.value = fullEmail;
  const box = document.getElementById(containerId);
  if (box) box.style.display = 'none';
}

// 2. Kịch bản kiểm tra giờ Thứ 6 & Thứ 7
function validateBookingTime(selectedDateStr, hourVal, minuteVal) {
  if (!selectedDateStr || hourVal === "" || minuteVal === "") return { valid: true };
  const dateObj = new Date(selectedDateStr);
  const day = dateObj.getDay(); // 5 = Thứ 6, 6 = Thứ 7

  if (day === 5 || day === 6) {
    const h = parseInt(hourVal, 10);
    const m = parseInt(minuteVal, 10);
    if (h < 14) {
      return { valid: false, msg: "Thứ 6 & Thứ 7 quán nhận đón khách từ 14:00 trở đi." };
    }
    if (h > 18 || (h === 18 && m > 30)) {
      return { 
        valid: false, 
        msg: "🔒 ĐÃ QUÁ 18H31 (THỨ 6 & THỨ 7)\nRất tiếc, đã quá 18h31 nên hệ thống đã khóa nhận đặt tiệc Decor cho ngày Thứ 6 / Thứ 7\nAnh/chị vui lòng chọn một ngày khác giúp Túi nhé ạ!" 
      };
    }
  }
  return { valid: true };
}
