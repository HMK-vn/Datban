/* Cầu nối thay cho google.script.run: gọi Apps Script qua API (không kèm cookie Google)
   -> không bị lỗi "không thể mở tệp" khi trình duyệt đăng nhập nhiều tài khoản Google */
(function () {
  if (window.google && window.google.script) return;
  var API = "https://script.google.com/macros/s/AKfycbxzF35ugPCL5jDZrmZzOSx4-ZsoEZimxM6lDKn4zYcajHimG_K1250pip16IEqsDHqQQg/exec";
  function goi(ten, args, ok, fail) {
    fetch(API, { method: "POST", redirect: "follow", credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: ten, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("Máy chủ trả lỗi " + r.status); return r.json(); })
      .then(function (res) {
        if (res.ok) { if (ok) ok(res.result); }
        else { var e = new Error(res.error); if (fail) fail(e); else alert("Lỗi: " + res.error); }
      })
      .catch(function (err) {
        var e = new Error("Không kết nối được máy chủ, vui lòng thử lại. (" + err.message + ")");
        if (fail) fail(e); else alert(e.message);
      });
  }
  function taoRun() {
    var ok = null, fail = null, base = {
      withSuccessHandler: function (f) { ok = f; return p; },
      withFailureHandler: function (f) { fail = f; return p; },
      withUserObject: function () { return p; }
    };
    var p = new Proxy(base, { get: function (t, ten) {
      if (ten in t) return t[ten];
      return function () { goi(String(ten), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: { host: { close: function () { throw new Error("Không chạy trong Google Sheet"); } } } };
  Object.defineProperty(window.google.script, "run", { get: taoRun });
})();
</script>

  <style>

<body class="py-4">
  <div class="container" style="max-width: 640px;">
    <div class="card">
      <div class="header-bar text-center">
        <h4 class="mb-1 fw-bold">🔍 TRA CỨU ĐƠN ĐẶT BÀN</h4>
        <p class="mb-0 small">Túi Nướng Lavender · Trạng thái đơn đặt bàn</p>
      </div>
      <div class="card-body p-3 p-sm-4">
        <label class="form-label fw-bold">Nhập số điện thoại hoặc email đặt bàn:</label>
        <div class="input-group mb-3">
          <input type="text" inputmode="text" id="inputSearchPhone" class="form-control form-control-lg" placeholder="VD: 0911 588 138 hoặc Tui@gmail.com" onkeypress="if(event.key==='Enter') searchBooking()">
          <button class="btn btn-search px-4" id="btnSearch" onclick="searchBooking()">Tra cứu</button>
        </div>
        <div id="bookingResult"><div class="text-center py-3 text-muted small">Nhập số điện thoại hoặc email Quý khách đã dùng khi đặt bàn.</div></div>
        <div class="text-center small text-muted mt-2">Cần hỗ trợ? Hotline <a href="tel:0911588138" class="fw-bold text-danger text-decoration-none">0911 588 138</a></div>
      </div>
    </div>
  </div>
  <script>
    function escapeHtml(str) { return str == null ? "" : String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function ngayVN(s) { var m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + "/" + m[2] + "/" + m[1] : (s || ""); }
    function tien(v) { var s = String(v || "").trim(); return /^\d+$/.test(s) ? Number(s).toLocaleString("vi-VN") + " VNĐ" : s; }
    var TT = {
      choduyet: ["⏳ Đang chờ Túi xác nhận", "⏳ Túi đang kiểm tra, tra cứu lại sau ít phút."],
      xacnhan: ["✅ Đã xác nhận", "⏱ Giữ bàn 15-20 phút · Đổi giờ báo trước 2h."],
      chohoan: ["⚠ Ngày đã đủ bàn decor", "☎ Gọi hotline đổi ngày, hoặc nhận lại cọc."],
      dahoan: ["💸 Đã hoàn tiền cọc", "💸 Sau 24h chưa nhận, vui lòng gọi hotline."]
    };
    var HOAN = { chokhach: "chờ Quý khách gửi tài khoản", dangxuly: "Túi đang hoàn cọc", dahoan: "đã hoàn tiền" };
    function veDon(d) {
      var t = TT[d.tt] || TT.choduyet, buoc = { choduyet: 1, xacnhan: 3, chohoan: 2, dahoan: 3 }[d.tt] || 1;
      var b = d.tt === "chohoan" || d.tt === "dahoan" ? ["Gửi yêu cầu", "Đủ bàn decor", "Hoàn cọc"] : ["Gửi yêu cầu", "Túi kiểm tra", "Xác nhận"];
      // Gọn 1 dòng mỗi nhóm thông tin
      var kv = [["📅", [ngayVN(d.ngay), d.gio, d.soKhach ? d.soKhach + " khách" : ""].filter(Boolean).join(" · ")], ["👤", [d.ten, d.sdt].filter(Boolean).join(" · ")],
        ["💰", d.tienCoc && d.tienCoc !== "0" ? "Cọc " + tien(d.tienCoc) : ""], ["🎀", d.mauDecor], ["🪑", d.banSo ? "Bàn " + d.banSo : ""]].filter(function(x) { return x[1]; });
      return '<div class="don"><div class="don-h"><span class="ma">' + escapeHtml(d.ma || "Đơn đặt bàn") + '</span><span class="tt tt-' + d.tt + '">' + t[0] + '</span></div>' +
        '<div class="kv">' + kv.map(function(x) { return '<div title="' + escapeHtml(x[1]) + '">' + x[0] + ' ' + escapeHtml(x[1]) + '</div>'; }).join("") + '</div>' +
        '<div class="buoc">' + b.map(function(x, i) { return '<div class="' + (i < buoc ? "xong" : "") + '">' + (i + 1) + '. ' + x + '</div>'; }).join("") + '</div>' +
        '<div class="note"><div>' + t[1] + '</div>' +
          (d.tt === "choduyet" ? '<div style="color:#b3261e">☎ 30 phút chưa Xác nhận/Từ chối: gọi hotline</div>' : '') + (d.hoan ? '<div><b>Hoàn cọc:</b> ' + HOAN[d.hoan] + '</div>' : '') + '</div>' +
        (d.linkHoanCoc ? '<a class="btn btn-sm btn-search w-100 mt-2" href="' + escapeHtml(d.linkHoanCoc) + '">💜 Gửi thông tin nhận hoàn cọc</a>' : '') + '</div>';
    }
    function searchBooking() {
      var p = document.getElementById("inputSearchPhone").value.trim(), resDiv = document.getElementById("bookingResult"), btn = document.getElementById("btnSearch");
      if (p.indexOf("@") === -1 && p.replace(/\D/g, "").length < 7) { resDiv.innerHTML = '<div class="alert alert-warning text-center small">Vui lòng nhập ít nhất 7 số liên tiếp của số điện thoại, hoặc email.</div>'; return; }
      btn.disabled = true; btn.innerText = "Đang tìm...";
      resDiv.innerHTML = '<div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm"></div> Đang tìm...</div>';
      google.script.run.withSuccessHandler(function(res) {
        btn.disabled = false; btn.innerText = "Tra cứu";
        if (!res.success) { resDiv.innerHTML = '<div class="alert alert-warning text-center small">' + escapeHtml(res.message) + '</div>'; return; }
        if (!res.data || !res.data.length) { resDiv.innerHTML = '<div class="alert alert-warning text-center small">Không tìm thấy đơn đặt bàn nào khớp. Quý khách kiểm tra lại số / email, hoặc gọi hotline.</div>'; return; }
        resDiv.innerHTML = '<div class="small text-muted mb-2">Tìm thấy <b>' + res.tong + '</b> đơn' + (res.tong > res.data.length ? ' (hiện ' + res.data.length + ' đơn gần nhất)' : '') + ':</div>' + res.data.map(veDon).join("");
      }).withFailureHandler(function(e) {
        btn.disabled = false; btn.innerText = "Tra cứu";
        resDiv.innerHTML = '<div class="alert alert-danger text-center small">Lỗi kết nối, vui lòng thử lại.</div>';
      }).traCuuDonCongKhai(p);
    }
    // Vừa đặt bàn xong trên cùng trang web: tự điền số đã đặt và tra cứu luôn (không đưa SĐT lên đường link)
    try { var q0 = sessionStorage.getItem("tracuu_q"); if (q0) { sessionStorage.removeItem("tracuu_q"); document.getElementById("inputSearchPhone").value = q0; setTimeout(searchBooking, 300); } } catch (e) {}
  </script>
