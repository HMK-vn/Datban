/* Cầu nối thay cho google.script.run: gọi Apps Script qua API (không kèm cookie Google)
   -> không bị lỗi "không thể mở tệp" khi trình duyệt đăng nhập nhiều tài khoản Google */
(function () {
  if (window.google && window.google.script) return;
  var API = "https://script.google.com/macros/s/AKfycbxzF35ugPCL5jDZrmZzOSx4-ZsoEZimxM6lDKn4zYcajHimG_K1250pip16IEqsDHqQQg/exec";
  function goi(ten, args, ok, fail) {
    fetch(API, { method: "POST", redirect: "follow", credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: ten, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("Máy chủ trả lỗi " + r.status); return r.json(); })
      .then(function (res) {
        if (res.ok) { if (ok) ok(res.result); }
        else { var e = new Error(res.error); if (fail) fail(e); else alert("Lỗi: " + res.error); }
      })
      .catch(function (err) {
        var e = new Error("Không kết nối được máy chủ, vui lòng thử lại. (" + err.message + ")");
        if (fail) fail(e); else alert(e.message);
      });
  }
  function taoRun() {
    var ok = null, fail = null, base = {
      withSuccessHandler: function (f) { ok = f; return p; },
      withFailureHandler: function (f) { fail = f; return p; },
      withUserObject: function () { return p; }
    };
    var p = new Proxy(base, { get: function (t, ten) {
      if (ten in t) return t[ten];
      return function () { goi(String(ten), Array.prototype.slice.call(arguments), ok, fail); };
    } });
    return p;
  }
  window.google = { script: { host: { close: function () { throw new Error("Không chạy trong Google Sheet"); } } } };
  Object.defineProperty(window.google.script, "run", { get: taoRun });
})();
</script>
<script>
  (function () {
    var app = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (app) return;
    try { if (localStorage.getItem("anCaiApp") === "1") return; } catch (e) {}
    function hien(html, bam) {
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#5b2a86;color:#fff;border-radius:12px;padding:10px 12px;font:600 14px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:460px;margin:0 auto";
      d.innerHTML = '<span style="flex:1">' + html + '</span>' + (bam ? '<button style="border:0;border-radius:8px;padding:6px 12px;font-weight:700;color:#5b2a86;background:#fff">Cài</button>' : '') + '<button aria-label="Đóng" style="border:0;background:none;color:#fff;font-size:20px;line-height:1">×</button>';
      var nut = d.querySelectorAll("button");
      if (bam) nut[0].onclick = function () { bam(); d.remove(); };
      nut[nut.length - 1].onclick = function () { d.remove(); try { localStorage.setItem("anCaiApp", "1"); } catch (e) {} };
      document.body.appendChild(d);
    }
    addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); hien("📲 Cài app Túi Nướng lên điện thoại", function () { e.prompt(); }); });
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !/CriOS|FxiOS/.test(navigator.userAgent);
    if (ios) addEventListener("load", function () { hien("📲 Cài app: bấm <b>Chia sẻ</b> ⬆️ rồi chọn <b>Thêm vào MH chính</b>"); });
  })();
</script>
